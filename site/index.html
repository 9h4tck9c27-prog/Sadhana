<style>
:root{
  --ink:#14162B; --slate:#1B1E38; --horizon:#2C3057;
  --moon:#E8E4DA; --muted:#8B8FA8; --dim:#AEB1C2; --body:#C9CBD8;
  --ash:#454A6B; --asht:#767BA4; --amrit:#D9A441;
  --serif:'Lora',Georgia,serif; --util:'Poppins',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--moon); font-family:var(--serif);
  line-height:1.5; overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:0 22px 30px}

/* dot band */
.band{display:flex;gap:9px;justify-content:center;align-items:center;padding:16px 0 14px;flex-wrap:nowrap}
.grp{display:flex;gap:4.5px}
.dot{width:5px;height:5px;border-radius:50%;border:1px solid rgba(232,228,218,.16);background:transparent;flex:none}
.dot.done{background:var(--amrit);border-color:var(--amrit);box-shadow:0 0 7px rgba(217,164,65,.6)}
.dot.now{border-color:var(--moon);transform:scale(1.5)}
.dot.ash{background:var(--ash);border-color:var(--ash);box-shadow:none}
.bar{height:6px;border-radius:3px;background:#252A48;width:100%;overflow:hidden;margin:18px 0 12px}
.bar i{display:block;height:100%;background:var(--amrit);border-radius:3px}
@media (prefers-reduced-motion:no-preference){
  .dot.now{animation:breathe 5.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
}

/* type */
.lab{font-family:var(--util);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-family:var(--util);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--amrit);font-weight:500}
h1{font-size:27px;font-weight:400;line-height:1.22;letter-spacing:-.01em;margin:14px 0 0}
h1 em{font-style:italic;color:var(--amrit)}
h2{font-size:22px;font-weight:400;line-height:1.24;margin:12px 0 0}
p{font-size:15px;font-weight:400;color:var(--dim);margin-top:16px}
p.sm{font-size:13.5px;color:var(--muted);margin-top:12px}
p.accent{color:var(--amrit);font-style:italic}
.grow{flex:1;min-height:20px}
.center{text-align:center}

/* lotus */
.lotus{display:block;margin:0 auto}
.lotus path{fill:none;stroke:#9AA0BE;stroke-width:1.6;vector-effect:non-scaling-stroke}
.lotus line{stroke:#9AA0BE;stroke-width:1.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lotus.gold path{stroke:var(--amrit)}
.lotus.gold line{stroke:var(--amrit)}
.lotus.solid path{fill:var(--amrit);stroke:var(--ink);stroke-width:1.4}
.lotus.solid line{display:none}
@media (prefers-reduced-motion:no-preference){
  .lotus.draw path{stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1s ease-out forwards}
  .lotus.draw line{opacity:0;animation:fade .5s ease-out .9s forwards}
  .lotus.draw path:nth-child(1){animation-delay:0s}
  .lotus.draw path:nth-child(2){animation-delay:.09s}
  .lotus.draw path:nth-child(3){animation-delay:.09s}
  .lotus.draw path:nth-child(4){animation-delay:.18s}
  .lotus.draw path:nth-child(5){animation-delay:.18s}
  .lotus.draw path:nth-child(6){animation-delay:.27s}
  .lotus.draw path:nth-child(7){animation-delay:.27s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .lotus.solid path{opacity:0;animation:fade .5s ease-out forwards}
  .lotus.solid path:nth-child(n+2){animation-delay:.12s}
  .lotus.solid path:nth-child(n+4){animation-delay:.24s}
  .lotus.solid path:nth-child(n+6){animation-delay:.36s}
}
.wordmark{font-family:var(--util);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--moon);text-align:center;margin-top:14px;font-weight:500}

/* controls */
.hr{height:1px;background:var(--horizon);margin:22px 0}
input[type=text],input[type=date],select,textarea{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--horizon);
  color:var(--moon);font-family:var(--serif);font-size:17px;padding:8px 0 10px;
  border-radius:0;-webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--amrit)}
input::placeholder,textarea::placeholder{color:var(--muted);font-style:italic}
select{background:var(--slate);border:1px solid var(--amrit);border-radius:5px;padding:12px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{
  font-family:var(--util);font-size:12.5px;padding:8px 14px;border:1px solid var(--horizon);
  border-radius:100px;color:var(--dim);background:transparent;cursor:pointer;
}
.chip[aria-pressed=true]{border-color:var(--amrit);color:var(--amrit);background:rgba(217,164,65,.09)}
.chip.dash{border-style:dashed;color:var(--muted)}
.btn{
  display:block;width:100%;font-family:var(--util);font-size:13.5px;font-weight:500;
  letter-spacing:.05em;text-align:center;padding:16px;border-radius:100px;border:none;
  background:var(--amrit);color:var(--ink);margin-top:22px;cursor:pointer;
}
.btn.quiet{background:transparent;border:1px solid var(--horizon);color:var(--moon)}
.btn.text{background:transparent;color:var(--muted);padding:13px;font-size:12.5px;margin-top:8px;border:none}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:flex-end}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid var(--horizon);background:transparent;flex:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.mic.on{border-color:var(--amrit);color:var(--amrit)}

/* hold button */
.hold{position:relative;overflow:hidden;background:var(--slate);border:1px solid var(--amrit);
  height:68px;padding:0;margin-top:22px;border-radius:100px;width:100%;display:block;
  touch-action:none;cursor:pointer;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none}
.hold *{-webkit-user-select:none;user-select:none;pointer-events:none}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--amrit);
  overflow:hidden;z-index:2}
.hold .lbl{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px}
.hold .fill .lbl{left:0;top:0;height:100%;right:auto}
.hold .lbl b{font-family:var(--util);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1}
.hold .lbl i{font-family:var(--util);font-style:normal;font-weight:400;font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;line-height:1;opacity:.72}
.hold .base{color:var(--moon);z-index:1}
.hold .over{color:var(--ink)}
.hold.pressing{border-color:var(--moon)}

/* entries */
.entry{border-top:1px solid var(--horizon);padding:16px 0 18px}
.entry:first-of-type{border-top:none}
.emeta{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--util);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.emeta b{color:var(--moon);font-weight:500}
.shift{font-family:var(--util);font-size:11.5px;color:var(--amrit);margin:9px 0 7px}
.shift span{color:var(--muted);margin:0 7px}
.etext{font-size:15.5px;font-style:italic;color:var(--body);line-height:1.45}
.past .emeta,.past .emeta b,.past .shift,.past .etext,.past .shift span{color:var(--asht)}
.divider{display:flex;justify-content:space-between;font-family:var(--util);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);border-top:1px solid var(--horizon);padding-top:16px;margin-top:26px}
.stat{border-top:1px solid var(--horizon);padding:15px 0;display:flex;justify-content:space-between;align-items:baseline}
.stat .k{font-family:var(--util);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:19px}
.stat .v.gold{color:var(--amrit)}
.sutra{border-left:1.5px solid var(--amrit);padding-left:16px;margin-top:22px}
.sutra .tl{font-style:italic;font-size:14px;color:var(--moon);margin-top:9px}
.sutra .en{font-size:14px;color:var(--dim);margin-top:8px}
.card{border:1px solid var(--horizon);border-radius:9px;padding:16px;margin-top:14px}
.card.active{border-color:var(--amrit)}
.note{border:1px solid var(--horizon);background:var(--slate);border-radius:7px;padding:16px;margin-top:24px}
.steps{margin-top:22px}
.step{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.step .n{font-family:var(--util);font-size:10px;letter-spacing:.14em;color:var(--amrit);font-weight:500;padding-top:4px;flex:none;width:20px}
.step .t{font-size:15.5px}
.step .b{font-size:13px;color:var(--muted);margin-top:3px}
.step svg{flex:none;margin-top:2px}
.kc{display:inline-block;font-family:var(--util);font-size:12px;background:#242848;border:1px solid var(--horizon);border-radius:5px;padding:7px 12px;margin-right:7px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--slate);border:1px solid var(--horizon);color:var(--moon);font-family:var(--util);font-size:12.5px;padding:12px 20px;border-radius:100px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.show{opacity:1}
.player{margin-top:26px}
.prow{display:flex;align-items:center;justify-content:center;gap:26px}
.pbtn{background:none;border:0;padding:9px;cursor:pointer;line-height:0;opacity:.85}
.pbtn:active{opacity:.5}
.pplay{width:62px;height:62px;border-radius:50%;border:0;background:var(--amrit);
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:0}
.pplay:disabled{opacity:.4}
.pplay:active{transform:scale(.96)}
.ptrack{height:3px;border-radius:2px;background:var(--horizon);margin:22px 4px 0;overflow:hidden}
.ptrack i{display:block;height:100%;width:0;background:var(--amrit);transition:width .25s linear}
.ptime{display:flex;justify-content:space-between;margin-top:9px;
  font-family:var(--util);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.perr{font-family:var(--util);font-size:11px;letter-spacing:.06em;color:var(--amrit);
  text-align:center;margin-top:10px;min-height:14px}
.late{font-family:var(--util);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash);margin-top:7px}
.beat{margin-bottom:30px}
.bt{font-family:var(--serif);font-size:25px;color:var(--moon);line-height:1.2}
.bb{font-size:16px;color:var(--muted);margin-top:5px}
.kept{display:flex;align-items:center;gap:16px;border-top:1px solid var(--horizon);
  padding:18px 0;cursor:pointer}
.kept:last-of-type{border-bottom:1px solid var(--horizon)}
.keptlotus{flex:none;width:36px;display:flex;align-items:center;justify-content:center}
.keptbody{flex:1;min-width:0}
.keptname{font-family:var(--serif);font-size:19px;color:var(--moon)}
.keptmeta{font-family:var(--util);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-top:5px}
.keptdate{font-family:var(--util);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ash);flex:none;text-align:right}
.dayno{font-family:var(--serif);font-size:96px;line-height:1;color:var(--moon);letter-spacing:-.02em}
.dayof{font-family:var(--util);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:12px}
/* Safari's floating toolbar sits over the page and is not covered by
   safe-area-inset-bottom, so keep buttons clear of it in the browser. */
body.browser #app{padding-bottom:180px}
input[type=date]{text-align:left}

/* boot splash — paints from the HTML itself, before any script runs */
#boot{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:100;
  transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot svg path{fill:none;stroke:var(--amrit);stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.55}
@media (prefers-reduced-motion:no-preference){
  #boot svg{animation:bloom 2.4s ease-in-out infinite}
  @keyframes bloom{0%,100%{opacity:.35}50%{opacity:1}}
}
</style>

<body>

<script>
'use strict';
const KEY = 'sadhana:v1';
// Practice must be unbroken — that is the rule. Logging it need not be.
// For a few hours after the boundary we ask whether yesterday was practised,
// so a kept day is never lost to forgetting the phone.
// No clock on it. `day === marked + 2` already says exactly one day is
// unrecorded and today is the day after it — which IS the window. The six
// hours this used to carry closed the door at 6am, and across 67 recorded
// sittings this practitioner opened the app before 6am once. A forgiveness
// nobody can reach is not a forgiveness.
// Ordered expansive to contracted. Fourteen, because after 39 days of real
// use the old twelve collapsed: departures landed on Steady or Fulfilled 69%
// of the time, and only six words were ever chosen for "after" at all. The
// additions give the settled end somewhere to spread, and Quiet stops Steady
// absorbing every ordinary day.
const DEFAULT_WORDS = ['Radiant','Fulfilled','Light','Spacious','Clear','Warm',
                       'Steady','Quiet','Tender',
                       'Resistant','Scattered','Restless','Dull','Heavy'];
// Never chosen once in 78 selections: Happy reads as too absolute to claim,
// Anxious as too clinical to pick. Retired — but only from someone's list if
// they never used them.
const RETIRED_WORDS = ['Happy','Anxious'];
const MAX_CUSTOM_WORDS = 6;
const OBSTACLES = ['Illness','Dullness','Doubt','Carelessness','Laziness','Circumstance'];

// Someone's own past practices are the only list guaranteed to be right for them,
// so those come first. The vayu kriyas are shortcuts, never a canon — free text
// stays primary and anything typed there is equally valid.
// Usage is derived from the entries rather than stored, so it stays true even
// if a record is merged or restored.
function wordUse(){
  const c = {};
  (S.attempts || []).forEach(a => (a.entries || []).forEach(e => {
    if(e.before) c[e.before] = (c[e.before] || 0) + 1;
    if(e.after)  c[e.after]  = (c[e.after]  || 0) + 1;
  }));
  return c;
}
function wordUsed(w){
  return (S.attempts || []).some(a => (a.entries || []).some(
    e => e.before === w || e.after === w));
}

// An existing record carries its own copy of the vocabulary, so a new default
// reaches nobody without this. Adds words that did not exist before, retires
// the two that went unused — but never one someone actually chose — and keeps
// custom additions at the end.
function migrateWordOrder(){
  if(!S || !Array.isArray(S.words)) return;
  const known = new Set(DEFAULT_WORDS.concat(RETIRED_WORDS));
  const custom = S.words.filter(w => !known.has(w));
  const kept = RETIRED_WORDS.filter(w => S.words.includes(w) && wordUsed(w));
  const next = DEFAULT_WORDS.concat(kept, custom);
  if(next.length !== S.words.length || next.some((w, i) => w !== S.words[i])){
    S.words = next;
    return true;
  }
  return false;
}

function pruneWords(){
  const base = {};
  DEFAULT_WORDS.concat(RETIRED_WORDS).forEach(w => base[w] = true);
  const custom = S.words.filter(w => !base[w]);
  if(custom.length <= MAX_CUSTOM_WORDS) return;
  const use = wordUse();
  // keep the most-used; ties go to the most recently added, which sits later
  const ranked = custom.slice().sort((a, b) => {
    const d = (use[b] || 0) - (use[a] || 0);
    return d !== 0 ? d : S.words.indexOf(b) - S.words.indexOf(a);
  });
  const keep = new Set(ranked.slice(0, MAX_CUSTOM_WORDS));
  S.words = S.words.filter(w => base[w] || keep.has(w));
}

function pastPractices(){
  const seen = {}, out = [];
  (S.completed||[]).forEach(c => {
    if(c && c.practice && !seen[c.practice]){ seen[c.practice] = 1; out.push(c.practice); }
  });
  return out.slice(0, 6);
}
function suggestionsHTML(){
  const mine = pastPractices();
  if(!mine.length) return '';
  return `<div style="margin-top:24px"><div class="lab">Practised before</div>
          <div class="chips">${mine.map(w =>
            `<button class="chip" data-practice="${esc(w)}" aria-pressed="${S.practice===w}">${esc(w)}</button>`
          ).join('')}</div></div>`;
}

const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- state ---------- */
function blank(){
  return {
    practice:'', lengthDays:40, dayStartHour:3,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
    startDate:null, words: DEFAULT_WORDS.slice(),
    attempts:[], completed:[], onboarded:false, installShown:false,
    draft:null, view:null, audio:null, syncOffered:false, freshStart:false, updatedAt:0
  };
}
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Could not save — storage is full or blocked'); }
  idbPut(S);
  if(SYNC.on) syncPush();
}


/* ---------- a second copy on the device ----------
   Safari treats IndexedDB as more durable than localStorage and evicts it
   later. Same data, written alongside; read only if localStorage comes back
   empty. Every call is fire-and-forget — nothing here can block a save. */
let _db = null;
function idbOpen(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    try{
      // Version 2 adds the audio store. Recordings live in a store of their
      // own so that if the browser ever reclaims space it takes a file you
      // can add again, not the days you cannot.
      const r = indexedDB.open('sadhana', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('state')) db.createObjectStore('state');
        if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
      };
      r.onsuccess = () => { _db = r.result; res(_db); };
      r.onerror = () => rej(r.error);
      // another tab holding version 1 open would otherwise hang this forever
      r.onblocked = () => rej(new Error('blocked'));
    }catch(e){ rej(e); }
  });
}

/* ---------- the recording ----------
   One file per practice, picked once from Files or iCloud and kept on the
   device. Nothing is uploaded. The record and the recording never share a
   store, and the record is never the thing that gets evicted. */
function audioPut(id, blob){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction('audio', 'readwrite');
    tx.objectStore('audio').put(blob, id);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('aborted'));
  }));
}
function audioGet(id){
  return idbOpen().then(db => new Promise(res => {
    const r = db.transaction('audio', 'readonly').objectStore('audio').get(id);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => res(null);
  })).catch(() => null);
}
function audioDel(id){
  if(!id) return Promise.resolve();
  return idbOpen().then(db => {
    db.transaction('audio', 'readwrite').objectStore('audio').delete(id);
  }).catch(() => {});
}
function idbPut(state){
  idbOpen().then(db => {
    const tx = db.transaction('state', 'readwrite');
    tx.objectStore('state').put(JSON.stringify(state), 'current');
  }).catch(()=>{});
}
function idbGet(){
  return idbOpen().then(db => new Promise(res => {
    const r = db.transaction('state', 'readonly').objectStore('state').get('current');
    r.onsuccess = () => res(r.result ? JSON.parse(r.result) : null);
    r.onerror = () => res(null);
  })).catch(()=>null);
}

/* ---------- the player ----------
   A plain <audio> element, not the Web Audio API: on iOS the Web Audio path
   is silent whenever the ringer switch is off, and a pre-dawn practice is
   exactly when the phone is silenced. */
const AUDIO = {el:null, url:null, ready:false, playing:false, loading:false, err:null};

function fmtClock(s){
  if(!Number.isFinite(s) || s < 0) return '—';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function audioForget(){
  if(AUDIO.el){ try{ AUDIO.el.pause(); AUDIO.el.removeAttribute('src'); AUDIO.el.load(); }catch(e){} }
  if(AUDIO.url){ try{ URL.revokeObjectURL(AUDIO.url); }catch(e){} }
  AUDIO.el = null; AUDIO.url = null; AUDIO.ready = false; AUDIO.playing = false;
}

function audioLoad(){
  if(!S.audio || !S.audio.id || AUDIO.el || AUDIO.loading) return;
  AUDIO.loading = true; AUDIO.err = null;
  audioGet(S.audio.id).then(blob => {
    AUDIO.loading = false;
    if(!blob){ AUDIO.err = 'That recording is no longer on this phone.'; paintAudio(); return; }
    const el = new Audio();
    el.preload = 'auto';
    el.playsInline = true;
    AUDIO.url = URL.createObjectURL(blob);
    el.src = AUDIO.url;
    el.addEventListener('loadedmetadata', () => { AUDIO.ready = true; paintAudio(); });
    el.addEventListener('play',  () => { AUDIO.playing = true;  paintAudio(); });
    el.addEventListener('pause', () => { AUDIO.playing = false; paintAudio(); });
    el.addEventListener('ended', () => { AUDIO.playing = false; paintAudio(); });
    el.addEventListener('timeupdate', paintAudio);
    el.addEventListener('error', () => { AUDIO.err = 'That file could not be played.'; paintAudio(); });
    AUDIO.el = el;
    paintAudio();
  }).catch(() => { AUDIO.loading = false; });
}

function audioToggle(){
  const el = AUDIO.el;
  if(!el) return;
  // play() must be called inside the tap itself — nothing may be awaited first
  if(el.paused){
    el.play().then(() => {
      if('mediaSession' in navigator){
        try{
          navigator.mediaSession.metadata = new MediaMetadata({
            title: (S.audio && S.audio.name) || 'Practice',
            artist: S.practice || ''});
          navigator.mediaSession.setActionHandler('play',  () => audioToggle());
          navigator.mediaSession.setActionHandler('pause', () => audioToggle());
          navigator.mediaSession.setActionHandler('seekbackward', () => audioSkip(-15));
          navigator.mediaSession.setActionHandler('seekforward',  () => audioSkip(15));
        }catch(e){}
      }
    }).catch(() => { AUDIO.err = 'iOS would not start playback.'; paintAudio(); });
  } else {
    el.pause();
  }
}

function audioSkip(sec){
  const el = AUDIO.el;
  if(!el || !AUDIO.ready) return;
  const dur = Number.isFinite(el.duration) ? el.duration : el.currentTime + Math.abs(sec);
  el.currentTime = Math.max(0, Math.min(dur, el.currentTime + sec));
  paintAudio();
}

// The sitting screen is not re-rendered while the timer runs, so the player
// writes to its own nodes rather than asking for a repaint.
function paintAudio(){
  const el = AUDIO.el;
  const play = $('#a-play'), fill = $('#a-fill'), now = $('#a-now'),
        dur = $('#a-dur'), err = $('#a-err');
  if(err) err.textContent = AUDIO.err || '';
  if(play){
    play.innerHTML = AUDIO.playing ? ICON.pause : ICON.play;
    play.setAttribute('aria-label', AUDIO.playing ? 'Pause' : 'Play');
    play.disabled = !AUDIO.el;
  }
  if(!el) return;
  const d = Number.isFinite(el.duration) ? el.duration : 0;
  if(now) now.textContent = fmtClock(el.currentTime);
  if(dur) dur.textContent = d ? fmtClock(d) : '—';
  if(fill) fill.style.width = (d ? Math.min(100, el.currentTime / d * 100) : 0) + '%';
}

/* ---------- dates ---------- */
function ymdIn(date, tz){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
  const g = t => p.find(x=>x.type===t).value;
  return g('year')+'-'+g('month')+'-'+g('day');
}
// the sadhana-day a moment belongs to, honouring the 3am boundary and stored tz
function logicalYMD(date){
  const shifted = new Date(date.getTime() - S.dayStartHour*3600000);
  return ymdIn(shifted, S.tz);
}
// What the day number WOULD be under a different anchor, without changing
// anything. Moving the anchor never edits an entry — each keeps the ymd it
// was written with — it only re-asks which sadhana-day "now" falls in.
function dayNumberUnder(now, tz, hour){
  const a = currentAttempt();
  if(!a) return null;
  const shifted = new Date(now.getTime() - (hour != null ? hour : S.dayStartHour)*3600000);
  const n = daysBetween(a.startYMD, ymdIn(shifted, tz)) + 1;
  return Number.isFinite(n) ? n : null;
}

// A shift forward is safe while it leaves today at most one day past the last
// one recorded. Beyond that the router reads a gap and breaks the thread, so
// the honest answer is to log today first rather than to move the anchor.
// A sitting that was started but never finished still proves something: the
// timer ran, and often a word was chosen before it. That evidence outlives
// the session, so it should never quietly evaporate.
function draftYMD(){
  if(!S.draft || !S.draft.startedAt) return null;
  return logicalYMD(new Date(S.draft.startedAt));
}

function deviceTz(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || null; }
  catch(e){ return null; }
}

// A break is the heaviest thing this app says. Before it says it, check the
// one benign explanation: the anchor is still in a place you have left, and
// moving it to where you actually are puts you back on the next day.
function staleAnchor(now){
  const tz = deviceTz();
  if(!tz || tz === S.tz) return false;
  const a = currentAttempt();
  if(!a) return false;
  return anchorShift(now, tz).safe;
}

function anchorShift(now, tz){
  const a = currentAttempt();
  const marked = a ? highestMarked(a) : 0;
  const from = dayNumber(now);
  const to = dayNumberUnder(now, tz);
  const shifted = new Date(now.getTime() - S.dayStartHour*3600000);
  return {from, to, marked, tz,
          fromYMD: logicalYMD(now),
          toYMD: ymdIn(shifted, tz),
          safe: to != null && to >= 1 && to <= marked + 1,
          same: to === from};
}

// An entry's date comes from the anchor it was written under; its time must
// come from the same place, or the two disagree the moment you travel. The
// anchor is stamped on each entry so history stays true after the anchor moves.
function entryTime(e){
  if(!e || !e.startedAt) return '';
  try{
    return new Date(e.startedAt).toLocaleTimeString([], {
      hour:'numeric', minute:'2-digit', timeZone: e.tz || S.tz});
  }catch(err){
    return new Date(e.startedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
}

// Existing entries predate the stamp. They were all written under the anchor
// in force right now, so recording it now is the only moment it is knowable.
function stampEntryZones(){
  if(!S || !S.attempts) return false;
  let touched = false;
  S.attempts.forEach(a => (a.entries || []).forEach(e => {
    if(e && e.startedAt && !e.tz){ e.tz = S.tz; touched = true; }
  }));
  (S.completed || []).forEach(c => (c.attempts || []).forEach(a =>
    (a.entries || []).forEach(e => {
      if(e && e.startedAt && !e.tz){ e.tz = c.tz || S.tz; touched = true; }
    })));
  return touched;
}

function daysBetween(a,b){
  return Math.round((Date.parse(b+'T12:00:00Z') - Date.parse(a+'T12:00:00Z'))/86400000);
}
function currentAttempt(){ return S.attempts[S.attempts.length-1] || null; }
function dayNumber(now){
  const a = currentAttempt(); if(!a) return 0;
  const n = daysBetween(a.startYMD, logicalYMD(now)) + 1;
  return Number.isFinite(n) ? n : null;   // null is falsy; NaN slips past < comparisons
}

// A record can only be as good as its start date. If one ever goes missing,
// rebuild it from the earliest entry rather than rendering NaN at the user.
function repairState(){
  if(!S || !S.attempts) return;
  let fixed = false;
  S.attempts.forEach(a => {
    if(a && (!a.startYMD || !Number.isFinite(Date.parse(a.startYMD + 'T12:00:00Z')))){
      const days = (a.entries || []).map(e => e && e.ymd).filter(Boolean).sort();
      a.startYMD = days[0] || S.startDate || nowYMD();
      fixed = true;
    }
  });
  if(fixed) save();
}
function highestMarked(a){
  return a && a.entries.length ? Math.max.apply(null, a.entries.map(e=>e.day)) : 0;
}
// What the wall clock in `tz` reads at this instant, as an offset from UTC.
function tzOffsetMs(date, tz){
  const p = new Intl.DateTimeFormat('en-CA', {timeZone:tz, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'}).formatToParts(date);
  const g = t => p.find(x => x.type === t).value;
  const asUTC = Date.parse(g('year')+'-'+g('month')+'-'+g('day')+'T'+
                           (g('hour')==='24'?'00':g('hour'))+':'+g('minute')+':'+g('second')+'Z');
  return asUTC - date.getTime();
}

// The exact instant a sadhana-day opens: `hour` on `ymd`, in `tz`. Solved
// rather than approximated, because the offset depends on the instant we are
// solving for — twice around settles it, DST changes included.
function boundaryInstant(ymd, hour, tz){
  const wall = Date.parse(ymd + 'T00:00:00Z') + hour*3600000;
  let guess = wall;
  for(let i = 0; i < 2; i++) guess = wall - tzOffsetMs(new Date(guess), tz);
  return guess;
}

// This used to parse the boundary on the device's own clock, which is only
// right while the device and the anchor are in the same place. Travelling
// put the countdown — and the logging grace window — hours out.
function msUntilClose(now){
  let t = boundaryInstant(addDays(logicalYMD(now), 1), S.dayStartHour, S.tz) - now.getTime();
  // On a clocks-forward day the hour subtracted inside logicalYMD can land
  // just before the boundary it names, which would report a day closing in
  // no time at all. Roll on: a new day has in fact just opened.
  if(t <= 0) t = boundaryInstant(addDays(logicalYMD(now), 2), S.dayStartHour, S.tz) - now.getTime();
  return t;
}
function msSinceClose(now){
  return 86400000 - msUntilClose(now);
}
function humanLeft(ms){
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
  if(h < 1) return m + (m===1?' minute':' minutes');
  return h + (h===1?' hour':' hours') + ' and ' + m + (m===1?' minute':' minutes');
}
const NUMWORDS = ['zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty',
  'Twenty-one','Twenty-two','Twenty-three','Twenty-four','Twenty-five','Twenty-six','Twenty-seven',
  'Twenty-eight','Twenty-nine','Thirty','Thirty-one','Thirty-two','Thirty-three','Thirty-four',
  'Thirty-five','Thirty-six','Thirty-seven','Thirty-eight','Thirty-nine','Forty'];
function numberWord(n){ return NUMWORDS[n] || String(n); }
function hourText(h){ return h === 0 ? 'midnight' : h + ':00am'; }
function fmtDate(ymd, opt){
  const d = new Date(ymd+'T12:00:00');
  return d.toLocaleDateString(undefined, opt || {weekday:'long',day:'numeric',month:'long'});
}
function addDays(ymd,n){
  const d = new Date(Date.parse(ymd+'T12:00:00Z') + n*86400000);
  return d.toISOString().slice(0,10);
}
function nowYMD(){ return ymdIn(new Date(), S ? S.tz : Intl.DateTimeFormat().resolvedOptions().timeZone); }
